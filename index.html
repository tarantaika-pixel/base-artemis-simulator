<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   <title>Base Artemis — Lunar Mission Simulator</title>
   <style>
        * { box-sizing: border-box; }

        body {
            background-color: #050a18;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 18px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.6s;
        }
        body.night { background-color: #02040c; }
        body.flare { background-color: #1f0505; }
        .cockpit {
            max-width: 840px;
            width: 100%;
            background: linear-gradient(180deg, #102a54 0%, #0b1936 100%);
            border: 4px solid #2563eb;
            border-radius: 28px;
            padding: 18px 22px;
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.35);
            transition: border-color 0.6s, box-shadow 0.6s;
        }
        body.night .cockpit {
            border-color: #38bdf8;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.25);
        }
        body.flare .cockpit {
            border-color: #ef4444;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.6);
        }
        .viewport {
            position: relative;
            height: 175px;
            background: radial-gradient(circle at 70% 20%, #172554 0%, #020617 85%);
            border: 5px solid #3b82f6;
            border-radius: 40px 40px 16px 16px;
            overflow: hidden;
            margin-bottom: 14px;
            box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.9);
        }
        body.flare .viewport {
            background: radial-gradient(circle at 80% 30%, #7f1d1d 0%, #1a0404 85%);
            border-color: #ef4444;
        }
        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 40px 35px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 140px 70px, #cbd5e1, transparent),
                radial-gradient(2px 2px at 260px 25px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 390px 60px, #93c5fd, transparent),
                radial-gradient(2px 2px at 510px 30px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 650px 80px, #e2e8f0, transparent),
                radial-gradient(2px 2px at 740px 45px, #fff, transparent);
            opacity: 0.85;
        }
        .earth {
            position: absolute;
            left: 55px;
            top: 48px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #bae6fd, #2563eb 65%, #1e3a8a);
            box-shadow: 0 0 18px rgba(96, 165, 250, 0.8);
        }
        .sun {
            position: absolute;
            right: 85px;
            top: 36px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle, #fffbeb 20%, #facc15 60%, #ea580c);
            box-shadow: 0 0 45px #facc15;
            transition: all 0.8s ease;
        }
        body.night .sun {
            top: 200px;
            opacity: 0;
        }
        body.flare .sun {
            width: 92px;
            height: 92px;
            right: 70px;
            top: 18px;
            background: radial-gradient(circle, #fef2f2 15%, #ef4444 55%, #991b1b);
            box-shadow: 0 0 80px #ef4444;
        }
        .moon-surface {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 58px;
        }
        .hud-top {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
        }
        .hud-title {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px #000;
        }
        .solar-badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #f59e0b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
        }
        body.night .solar-badge { border-color: #38bdf8; }
        body.flare .solar-badge { border-color: #ef4444; color: #fecaca; }
        .day-banner {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            padding: 10px;
            border-radius: 12px;
            background: #091428;
            border: 2px solid #1e40af;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }
        body.flare .day-banner {
            background: #450a0a;
            border-color: #ef4444;
            color: #fecaca;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 14px;
        }
        .stat-box {
            background: #091428;
            border: 2px solid #1e3a8a;
            border-radius: 12px;
            padding: 11px 16px;
        }
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            gap: 10px;
        }
        .stat-label { white-space: nowrap; }
        .stat-value { white-space: nowrap; color: #38bdf8; font-size: 17px; }
        progress {
            width: 100%;
            height: 14px;
            border-radius: 7px;
            display: block;
        }
        #energyBar { accent-color: #eab308; }
        #foodBar { accent-color: #f59e0b; }
        #lifeBar { accent-color: #38bdf8; }
        #healthBar { accent-color: #22c55e; }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 14px;
        }
        .control-box {
            background: #0d1d3a;
            border: 2px solid #2563eb;
            border-radius: 12px;
            padding: 12px;
        }
        .control-box label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #93c5fd;
        }
        select {
            width: 100%;
            padding: 10px 8px;
            border-radius: 8px;
            border: 1px solid #3b82f6;
            background-color: #071124;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .log-box {
            background-color: #050c1a;
            border: 2px solid #38bdf8;
            border-left: 8px solid #38bdf8;
            padding: 13px 16px;
            border-radius: 10px;
            min-height: 52px;
            font-size: 17px;
            font-weight: 600;
            line-height: 1.4;
            margin: 0 0 14px 0;
        }
        .log-box.alert { border-color: #ef4444; color: #fecaca; background: #260808; }
        .log-box.win { border-color: #22c55e; color: #bbf7d0; background: #052e16; }
        .buttons {
            display: flex;
            gap: 14px;
        }
        button {
            flex: 2;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.5);
        }
        button:hover { filter: brightness(1.1); }
        button:disabled { background: #334155; box-shadow: none; cursor: not-allowed; }
        .restart-btn {
            flex: 1;
            background: linear-gradient(180deg, #475569 0%, #334155 100%);
            box-shadow: none;
        }

        @media (max-width: 680px) {
            .stats-grid, .controls-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
   <div class="cockpit"> 
    <div class="viewport">
        <div class="stars"></div>
        <div class="earth"></div>
        <div class="sun"></div>
        <svg class="moon-surface" viewBox="0 0 800 65" preserveAspectRatio="none">
            <path d="M0,35 Q120,5 250,30 T520,25 T800,32 L800,65 L0,65 Z" fill="#334155"/>
            <path d="M0,48 Q180,25 380,45 T800,42 L800,65 L0,65 Z" fill="#1e293b"/>
        </svg>
        <div class="hud-top">
            <div class="hud-title">🚀 BASE ARTEMIS CONTROL 🚀</div>
            <div class="solar-badge" id="solarBadge">☀️ Solar ☀️: +18 kW</div>
        </div>
    </div>
    <div class="day-banner">
        DAY <span id="day">1</span> / 28 — <span id="phase">LUNAR DAY ☀️</span>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-header">
                <span class="stat-label">⚡ Energy</span>
                <span class="stat-value"><span id="energy">40</span> / 100</span>
            </div>
            <progress id="energyBar" value="40" max="100"></progress>
        </div>

        <div class="stat-box">
            <div class="stat-header">
                <span class="stat-label">🥗 Food</span>
                <span class="stat-value"><span id="food">100</span> units</span>
            </div>
            <progress id="foodBar" value="100" max="100"></progress>
        </div>

        <div class="stat-box">
            <div class="stat-header">
                <span class="stat-label">💧 Water &amp; O2</span>
                <span class="stat-value"><span id="life">100</span>%</span>
            </div>
            <progress id="lifeBar" value="100" max="100"></progress>
        </div>
        <div class="stat-box">
            <div class="stat-header">
                <span class="stat-label">❤️ Crew Health</span>
                <span class="stat-value"><span id="health">100</span>%</span>
            </div>
            <progress id="healthBar" value="100" max="100"></progress>
        </div>
    </div>
<div class="controls-grid">
    <div class="control-box">
        <label for="tcs">🌡️ Thermal Control (TCS)</label>
        <select id="tcs">
            <option value="normal">Normal (2kW day / 5kW night)</option>
            <option value="eco">Night Eco (3kW night, -2 HP)</option>
            <option value="shelter">Storm Shelter (4kW, Rad Shield)</option>
            <option value="off">OFF (0 kW, -15 HP)</option>
        </select>
    </div>
    <div class="control-box">
        <label for="eclss">💨 Water &amp; O2 (ECLSS)</label>
        <select id="eclss">
            <option value="full">Full Closed-Loop (3 kW)</option>
            <option value="eco">Night Eco (1 kW, -3% tank)</option>
            <option value="off">OFF (0 kW, -20% tank)</option>
        </select>
    </div>
    <div class="control-box">
        <label for="greenhouse">🌱 Greenhouse</label>
        <select id="greenhouse">
            <option value="mode 0">OFF (0 kW, -4 food)</option>
            <option value="mode 1">Veggie Salad (3kW, -2 food, +1 HP)</option>
            <option value="mode 2">Full Board (60kW!, +2 food)</option>
        </select>
    </div>
</div> 
<p id="log" class="log-box">Welcome to Base Artemis!</p>

    <div class="buttons">
        <button id="nextBtn" onclick="nextDay()">End the day ▶</button>
        <button class="restart-btn" onclick="location.reload()">↺ Restart Mission</button>
    </div>
</div>
    <script>
        let day = 1;
        let energy = 40;
        let maxEnergy = 100;
        let food = 100;
        let life = 100;
        let health = 100;

        function nextDay() {
    let isLunarDay = (day <= 14); 
    let solar = 0;
    if (isLunarDay) {
        solar = 18;
        } else {
        solar = 0;
    }
    let cost = 0; 
    let message = "Day " + day + " completed. Systems nominal.";
    let tcsMode = document.getElementById("tcs").value;
    if (tcsMode === "normal") {
        if (isLunarDay) {
            cost = cost + 2; 
        } else {
            cost = cost + 5; 
        }
    } else if (tcsMode === "eco") {
        if (isLunarDay) {
            cost = cost + 2; 
        } else {
            cost = cost + 3;    
            health = health - 2; 
        }
    } else if (tcsMode === "shelter") {
        cost = cost + 4; 
    } else if (tcsMode === "off") {
        health = health - 15; 
    }
 if (day === 6 || day === 12) {
    if (tcsMode === "shelter") {
     message = "SOLAR FLARE HIT! Storm Shelter protected the crew (0 radiation damage)!";
    } else {
    health -= 15;
    message = "SOLAR FLARE HIT! No Storm Shelter! Crew took -15 radiation damage!";
    }
}
   let eclssMode = document.getElementById("eclss").value;
    if (eclssMode === "full") {
        cost = cost + 3; 
    } else if (eclssMode === "eco") {
            cost = cost + 1; 
            life = life - 3;
    } else if (eclssMode === "off") {
        life = life - 20; 
    }

    let greenMode = document.getElementById("greenhouse").value;
    if (greenMode === "mode 0") {
        food = food - 4;
    } else if (greenMode === "mode 1") {
        cost = cost + 3; 
        food = food - 2;
        health = health + 1;
    } else if (greenMode === "mode 2") {
       cost = cost + 60;
       food = food + 2;
       health = health + 2;
    }
    energy = energy + solar - cost;
    if (energy < 0) {
    energy = 0;
    health = health - 10;
    life = life - 10;
    message = "BLACKOUT! Too much power used! Systems failed!";
    }
            if (energy > maxEnergy) {
                energy = maxEnergy;
            }
    if (food <= 0) {
                food = 0;
                health = health - 15;
                message = "WARNING: Crew is starving!";
            }
    if (life <= 0) {
                life = 0;
                health = health - 25;
                message = "DANGER: Out of Water & Oxygen!";
            }
    if (health > 100) {
                health = 100;
            }
    if (health < 0) {
                health = 0;
            }
    if (health <= 0) {
        if (life <= 0) {
            message = "MISSION FAILED on Day " + day + ": Out of Water & Oxygen! Tip: Keep ECLSS on Full Closed-Loop during the day.";
            } else if (food <= 0) {
                message = "MISSION FAILED on Day " + day + ": Crew starved! Tip: Use Veggie Salad mode to stretch food supplies.";
            } else {
                    message = "MISSION FAILED on Day " + day + ": Critical Blackout or Thermal failure!";
            }
                document.getElementById("nextBtn").disabled = true;
            } else if (day === 28) {
                message = "MISSION ACCOMPLISHED! Crew survived the full 28-day Lunar Cycle! Health: " + health + "%";
                document.getElementById("nextBtn").disabled = true;
            } else {
                day = day + 1;
            if (day === 6 || day === 12) {
                message = "NASA SOLAR ALERT: Solar Flare hits TODAY! Switch TCS to Storm Shelter (4 kW)!";
                } else if (day === 15) {
                 message = "LUNAR NIGHT BEGINS! Solar power is 0! Switch to Economy and turn OFF Greenhouse!";
                }
            }
let phaseText = "Lunar Day ☀️";
            document.body.className = "";
            if (day > 14) {
                phaseText = "Lunar Night ❄️";
                document.body.className = "night";
            } else if ((day === 6 || day === 12) && health > 0) {
                phaseText = "Lunar Day ⚠️ SOLAR FLARE";
                document.body.className = "flare";
            }

    document.getElementById("day").innerText = day;
    document.getElementById("phase").innerText = phaseText;
    document.getElementById("energy").innerText = energy;
    document.getElementById("food").innerText = food;
    document.getElementById("life").innerText = life;
    document.getElementById("health").innerText = health;
    document.getElementById("energyBar").value = energy;
    document.getElementById("foodBar").value = food;
    document.getElementById("lifeBar").value = life;
    document.getElementById("healthBar").value = health;
    document.getElementById("log").innerText = message;
    document.getElementById("solarBadge").innerText = (day > 14) ? "❄️ Solar: 0 kW" : "☀️ Solar: +18 kW";
}
    </script>
</body>
</html>
